name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Teste rápido
        run: python -c "import vorticis_pdf.document, vorticis_pdf.converters, vorticis_pdf.fonts; print('ok')"

      - name: Gerar executável (PyInstaller)
        run: pyinstaller --noconfirm VorticisPDF.spec

      - name: Versão
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT;
          else echo "v=$(python -c 'import vorticis_pdf;print(vorticis_pdf.__version__)')" >> $GITHUB_OUTPUT; fi

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer\vorticis.iss

      - name: Versão portátil (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\VorticisPDF\* -DestinationPath "VorticisPDF-Portatil-${{ steps.ver.outputs.v }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VorticisPDF-${{ steps.ver.outputs.v }}
          path: |
            installer/Output/*.exe
            VorticisPDF-Portatil-*.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            VorticisPDF-Portatil-*.zip
